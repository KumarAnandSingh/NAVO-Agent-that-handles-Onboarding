<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes nfBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes nfBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
@keyframes nfPing{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes nfScan{from{transform:translateX(0)}to{transform:translateX(15px)}}
@keyframes nfThink{0%,100%{opacity:.25}50%{opacity:1}}
</style>
</helmet>
<span style="display:inline-flex;line-height:0;flex:none">{{ face }}</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;brand&quot;,&quot;calm&quot;,&quot;watching&quot;,&quot;thinking&quot;,&quot;acting&quot;,&quot;waiting&quot;,&quot;concerned&quot;,&quot;needs&quot;,&quot;celebrating&quot;],&quot;default&quot;:&quot;brand&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:48,&quot;min&quot;:16,&quot;max&quot;:240,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const h = React.createElement;
    const s = this.props.state ?? 'brand';
    const size = Number(this.props.size ?? 48);
    const C = '#7DD3FC';
    const st = (d, x = {}) => h('path', { d, stroke: C, strokeWidth: 3.2, strokeLinecap: 'round', strokeLinejoin: 'round', fill: 'none', ...x });
    const dot = (cx, cy, r = 3.4, x = {}) => h('circle', { cx, cy, r, fill: C, ...x });
    const star = (x, y, r, fill = C) => h('path', { d: `M${x} ${y - r}Q${x} ${y} ${x + r} ${y}Q${x} ${y} ${x} ${y + r}Q${x} ${y} ${x - r} ${y}Q${x} ${y} ${x} ${y - r}Z`, fill });
    const blink = { style: { transformBox: 'fill-box', transformOrigin: 'center', animation: 'nfBlink 4.5s infinite' } };
    const ant = { calm: '#34D399', celebrating: '#34D399', concerned: '#F59E0B', needs: '#F05A4F', waiting: '#94A3B8' }[s] || '#38BDF8';
    let face = [], extra = [];
    if (s === 'brand') face = [h('path', { d: 'M25 41V27l14 14V27', stroke: '#fff', strokeWidth: 3.8, strokeLinecap: 'round', strokeLinejoin: 'round', fill: 'none' }), star(45, 24, 3.6)];
    if (s === 'calm') face = [st('M20 35q4-5 8 0'), st('M36 35q4-5 8 0')];
    if (s === 'watching') face = [h('g', blink, dot(25, 33), dot(39, 33))];
    if (s === 'thinking') { face = [dot(27, 31, 3), dot(41, 31, 3), st('M37 25.5l7-1.6', { strokeWidth: 2.4 })]; extra = [0, 1, 2].map(i => h('circle', { cx: 55 + i * 3.6, cy: 11 - i * 3.2, r: 1.5 + i * .35, fill: '#38BDF8', style: { animation: `nfThink 1.2s ${i * .2}s infinite` } })); }
    if (s === 'acting') face = [h('ellipse', { cx: 25, cy: 32, rx: 3.4, ry: 2.6, fill: C }), h('ellipse', { cx: 39, cy: 32, rx: 3.4, ry: 2.6, fill: C }), h('rect', { x: 20, y: 42, width: 24, height: 2.4, rx: 1.2, fill: 'rgba(125,211,252,.25)' }), h('rect', { x: 20, y: 42, width: 9, height: 2.4, rx: 1.2, fill: C, style: { animation: 'nfScan 1.1s ease-in-out infinite alternate' } })];
    if (s === 'waiting') face = [st('M21 34h7'), st('M36 34h7')];
    if (s === 'needs') face = [h('g', blink, dot(25, 32, 4.2), dot(39, 32, 4.2)), st('M30 42h4')];
    if (s === 'concerned') face = [dot(25, 34, 3.2), dot(39, 34, 3.2), st('M20 27.5l7 1.8', { strokeWidth: 2.4 }), st('M44 27.5l-7 1.8', { strokeWidth: 2.4 })];
    if (s === 'celebrating') {
      face = [st('M20 34q4-6 8 0'), st('M36 34q4-6 8 0'), st('M28 40q4 3 8 0', { strokeWidth: 2.6 })];
      extra = [['M4 19l3 3', '#38BDF8'], ['M60 19l-3 3', '#F59E0B'], ['M2 37h4', '#F472B6'], ['M62 37h-4', '#34D399']].map(([d, c]) => h('path', { d, stroke: c, strokeWidth: 2.4, strokeLinecap: 'round' }));
      extra.push(star(11, 9, 3, '#F59E0B'), star(54, 8, 2.6, '#38BDF8'));
    }
    const glow = s === 'acting' || s === 'thinking' ? 'drop-shadow(0 0 6px rgba(56,189,248,.55))' : s === 'needs' ? 'drop-shadow(0 0 5px rgba(240,90,79,.4))' : 'drop-shadow(0 3px 4px rgba(11,21,48,.12))';
    const bob = s === 'acting' || s === 'celebrating' ? 'nfBob 2.2s ease-in-out infinite' : 'none';
    const face_ = h('svg', { width: size, height: size, viewBox: '0 0 64 64', style: { display: 'block', overflow: 'visible', filter: glow, animation: bob } },
      h('defs', null, h('linearGradient', { id: 'nfHead', x1: 0, y1: 0, x2: 0, y2: 1 }, h('stop', { offset: 0, stopColor: '#FFFFFF' }), h('stop', { offset: 1, stopColor: '#DCE4F4' }))),
      h('path', { d: 'M32 14V8', stroke: '#B8C3D9', strokeWidth: 2.2, strokeLinecap: 'round' }),
      h('circle', { cx: 32, cy: 6, r: 3.4, fill: ant, style: s === 'needs' ? { animation: 'nfPing 1s infinite' } : {} }),
      h('rect', { x: 7, y: 14, width: 50, height: 43, rx: 16, fill: 'url(#nfHead)', stroke: '#CCD5E6', strokeWidth: 1 }),
      h('rect', { x: 12, y: 19, width: 40, height: 32, rx: 11, fill: '#0B1530' }),
      ...face, ...extra);
    return { face: face_ };
  }
}
</script>
</body>
</html>
